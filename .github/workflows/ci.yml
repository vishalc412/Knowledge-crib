name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The canonical publish-readiness gate: build + test + biome check on the shipping target
  # (ubuntu, Node 22). Every PR must pass this before merge. Pinned actions, frozen lockfile.
  release-gate:
    name: Release gate (ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: Restore supported semantic tier
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ runner.temp }}/knowledge-crib-embed
          key: ${{ runner.os }}-knowledge-crib-e5-large-${{ hashFiles('packages/cli/src/embed-setup.ts', 'packages/cli/src/embed-onnx.ts', 'pnpm-lock.yaml') }}

      - name: Install supported semantic tier
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: |
          corepack pnpm@9.15.0 build
          node packages/cli/dist/cli.js embed setup --model large --yes --json

      - name: Run release gate
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: corepack pnpm@9.15.0 release:verify

      # WP6 slice D — the browser acceptance suite drives the real `crib viz` server
      # against a real isolated backend, so it needs real chromium. It is NOT part of
      # release:verify (the verify matrix below stays network-free and Windows-safe);
      # this is the one leg that downloads browser binaries.
      - name: Install browser binaries
        run: corepack pnpm@9.15.0 --filter knowledge-crib exec playwright install --with-deps chromium

      - name: Run browser acceptance suite
        run: corepack pnpm@9.15.0 verify:browser

      # WP9.4 — logs-on-failed-jobs: the gate writes release-evidence.json (and run logs) before
      # failing, so without an upload that evidence dies with the runner. Best-effort by design:
      # wildcards + if-no-files-found: warn mean a passing run uploads nothing, and a missing
      # path never fails the step. pnpm's own failure logs land outside the workspace (npm
      # cache _logs dir), so the workspace *.log wildcard is what is reachable here.
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-ci-diagnostics-release-gate
          path: |
            release-evidence.json
            *.log
            **/*.log
          if-no-files-found: warn
          retention-days: 7

  # Cross-platform / cross-Node coverage matrix: the same release:verify gate run on the other two
  # OSes and both supported Node lines (22 LTS + 24), so a darwin/windows-only or Node 24-only
  # regression in the node:sqlite backend, the O_EXCL lock, or path handling surfaces before users
  # hit it. fail-fast: false so every cell reports independently.
  verify-matrix:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        exclude:
          # ubuntu/Node 22 is already the release-gate cell — don't re-run it.
          - os: ubuntu-latest
            node: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: Restore supported semantic tier
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ runner.temp }}/knowledge-crib-embed
          key: ${{ runner.os }}-knowledge-crib-e5-large-${{ hashFiles('packages/cli/src/embed-setup.ts', 'packages/cli/src/embed-onnx.ts', 'pnpm-lock.yaml') }}

      - name: Install supported semantic tier
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: |
          corepack pnpm@9.15.0 build
          node packages/cli/dist/cli.js embed setup --model large --yes --json

      - name: Run release gate
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: corepack pnpm@9.15.0 release:verify

      # WP9.4 — logs-on-failed-jobs for every matrix cell: same best-effort diagnostics
      # upload as the release gate (wildcards + if-no-files-found: warn), namespaced per
      # OS/Node cell so a darwin/windows-only regression keeps its logs.
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-ci-diagnostics-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            release-evidence.json
            *.log
            **/*.log
          if-no-files-found: warn
          retention-days: 7
