name: Beta Installers

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-installers:
    name: Verify installers (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Both advertised installer platforms on BOTH supported Node majors. A POSIX-only run is not
      # Windows certification, and a Node-22-only run does not cover the Node 24 the launch policy
      # advertises — the install cycle (install → configure → uninstall → reinstall → authorized
      # recall under a spaces/non-ASCII home) has to actually execute in every advertised cell.
      matrix:
        os:
          - macos-latest
          - windows-latest
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: Build packages
        run: corepack pnpm@9.15.0 -r build

      - name: Run installer tests
        run: corepack pnpm@9.15.0 installer:test

      - name: Build beta installer bundle
        run: corepack pnpm@9.15.0 installer:build

      - name: Smoke install beta bundle
        run: corepack pnpm@9.15.0 installer:smoke

      - name: Smoke install under spaces/non-ASCII user dir (WP1.6)
        run: corepack pnpm@9.15.0 installer:smoke-userdir

      - name: Run generated macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=(dist/installers/knowledge-crib-*)
          sh "${bundle[0]}/install-macos.sh"
          crib --help

      - name: Run generated Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem dist/installers/knowledge-crib-* -Directory | Select-Object -First 1
          & (Join-Path $bundle.FullName "install-windows.ps1")
          crib --help

      - name: Upload beta installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-beta-installer-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/installers/knowledge-crib-*/
          if-no-files-found: error
