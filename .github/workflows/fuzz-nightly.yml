name: Fuzz Nightly

# The M3.5 parser-fuzz gate at scale: 10^6 seeded fast-check inputs per extractor × 9 extractors,
# each extract run in a worker_threads isolate under a per-call budget so a sync parse hang (the
# PL/SQL recover() class — surfaced + closed in M3.5) is caught by worker termination. The smoke
# gate (fuzz:check, 1000 iters) runs in every release:verify; this nightly runs the deep sweep a
# PR-time budget can't afford, so a hang/throw/invalid that only appears at 1-in-10^6 input
# frequency surfaces before a user hits it. Seeded (seed=1) → reproducible input-for-input;
# reproducers carry the exact (extractor, idx, text) so a finding is re-feedable.

on:
  schedule:
    # 09:13 UTC daily — off the :00/:30 marks to spread load across the fleet.
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-nightly:
    name: Parser fuzz (10^6/extractor, ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: Run nightly fuzz (10^6 iters/extractor)
        run: corepack pnpm@9.15.0 fuzz:nightly