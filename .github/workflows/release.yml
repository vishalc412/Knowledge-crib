name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile

      - name: Restore supported semantic tier
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ runner.temp }}/knowledge-crib-embed
          key: ${{ runner.os }}-knowledge-crib-e5-large-${{ hashFiles('packages/cli/src/embed-setup.ts', 'packages/cli/src/embed-onnx.ts', 'pnpm-lock.yaml') }}

      - name: Install supported semantic tier
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: |
          corepack pnpm@9.15.0 build
          node packages/cli/dist/cli.js embed setup --model large --yes --json

      - name: Run release gate
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: corepack pnpm@9.15.0 release:verify

      # A tag is a launch decision, not merely a build. Runtime certification receipts are
      # required for every advertised client/OS cell; the command writes the diagnostic manifest
      # before failing, so an incomplete matrix is actionable rather than silent.
      - name: Require client runtime certification
        env:
          KCRIB_EMBED_HOME: ${{ runner.temp }}/knowledge-crib-embed
        run: >-
          node scripts/release-evidence.mjs --require-pass --require-runtime-certification
          --certification-platforms darwin,linux,win32

      # WP9.4 — always(): the F07 diagnostic manifest is written before the gate exits 1, so
      # without this the evidence of a failed launch decision is stranded on the runner.
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-release-evidence-${{ matrix.os }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-release-bundle
          path: dist/installers/knowledge-crib-*/
          if-no-files-found: error
          retention-days: 7

  # WP9.4 — ONE aggregated launch decision. Every per-OS verify cell uploads its release
  # evidence even when it fails (see if: always() above); this job downloads all three
  # manifests and runs the aggregation CLI, which validates each cell, prints the per-cell
  # table, and exits non-zero on NO-GO or missing cell evidence. `if: !cancelled()` so the
  # NO-GO path is exactly the one that must not be silent: a failed verify cell still
  # produces a printed decision. The aggregation CLI is scripts/launch-decision.mjs
  # (WP8/WP9 slice, plain Node — no dependencies, no corepack needed).
  launch-decision:
    name: Aggregate launch decision
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download per-OS release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: knowledge-crib-release-evidence-*
          path: launch-evidence
          merge-multiple: false

      - name: Aggregate launch decision
        run: node scripts/launch-decision.mjs --cells launch-evidence

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: knowledge-crib-release-bundle
          path: release-bundle

      - name: Validate tag and bundle version
        shell: bash
        run: |
          MANIFEST="$(find release-bundle -type f -name manifest.json -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Verified bundle does not contain manifest.json" >&2
            exit 1
          fi
          VERSION="$(node -e 'const fs = require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version)' "$MANIFEST")"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match bundle version $VERSION" >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$(dirname "$MANIFEST")" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" "$BUNDLE_DIR"/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Knowledge-crib $GITHUB_REF_NAME"
