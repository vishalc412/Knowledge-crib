name: Release

# A tag is a launch decision, not a build. This file is the CALLER: the whole verification chain —
# build the candidate once, attest its bytes, verify the six hosted OS/Node cells, certify the
# twenty-one native vendor-runtime cells, deep-fuzz the same bytes once — lives in the reusable
# workflow `.github/workflows/release-verify.yml`, so the exact same chain can be exercised BEFORE
# publication (workflow_dispatch) instead of being discoverable only by cutting a tag. What this file
# adds on top is the half that must stay tag-shaped: aggregate every raw receipt into ONE decision,
# and publish only on GO, and only the digest that decision approved.
#
# The evidence layout is THREE SEPARATE ROOTS, reconstructed exactly as the verification jobs packed
# them: `evidence/cells/<os>/<node>/` (per-cell manifests, acceptance receipts, logs),
# `evidence/clients/` (the twenty-one raw vendor receipts), and `evidence/global/` (the deep-fuzz
# receipt). A receipt from one family never lands inside another family's root — the launch decision
# reads cells ONLY from the six policy-declared `<cellsRoot>/<os>/<node>/manifest.json` locations, so
# a client or global receipt dropped into the cells root is not merely ignored, it can no longer be
# mistaken for a cell that was never verified.
#
# The caller owns what a reusable workflow cannot set for itself: the tag trigger, the `contents`
# permission, and the per-tag concurrency group (a release for a tag is never cancelled by a re-run
# of itself; the verification jobs' `overwrite: true` uploads replace only their own artifacts).
# The operational prerequisites (three native self-hosted certification runners, all seven vendor
# clients signed in, credentials only in platform keychains) are stated in release-verify.yml, and
# nothing here may repeat them as if this file could satisfy them.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── the verification chain, extracted so it is callable before publication ─────────────────────
  verification:
    name: Release verification
    # The complete verification chain as a reusable workflow: candidate → certify × 21 → verify × 6
    # → fuzz. Its outputs (the attested digest) flow to the decision below exactly as they would from
    # a local job; its artifacts are this run's artifacts, so the downloads below need no special
    # handling. `secrets: inherit` is not used — this chain needs no repository secrets, and a chain
    # that someday does is a chain that has not been provisioned for certification.
    uses: ./.github/workflows/release-verify.yml

  # ── ONE aggregated launch decision ────────────────────────────────────────────────────────────
  #
  # The aggregate loads the six cell manifests AND the raw twenty-one client receipts AND the raw
  # deep-fuzz receipt, validates each against the committed policy, and prints the per-cell table. It
  # does not trust the summary any manifest wrote about its own certification — a manifest cannot
  # certify itself. `if: !cancelled()` so the NO-GO path is exactly the one that must not be silent:
  # when a required verification job fails, the decision still runs and names the missing or failed
  # cell (a cell whose artifact never arrived reads as `missing-evidence:<cell>`), instead of the run
  # simply dying with a red matrix and no verdict.
  launch-decision:
    name: Aggregate launch decision
    needs: [verification]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The ONLY package digest publication is allowed to ship, and only when the decision is GO.
      package_sha256: ${{ steps.decide.outputs.package_sha256 }}
      decision: ${{ steps.decide.outputs.decision }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Cells root #1 of three: the per-cell acceptance evidence. Every verification job uploaded its
      # cell directory rooted one level up (`cells/<os>/<node>/...`), so a merge download into ONE
      # directory reconstructs the policy's complete evidence layout — no per-artifact stitching, no
      # cell readable from anywhere but the six declared manifest locations.
      - name: Download per-cell release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-evidence-*
          path: evidence
          merge-multiple: true

      # Cells root #2: the raw vendor receipts, in their own root OUTSIDE the cells tree. Best-effort:
      # if certification produced nothing, the decision must say so by name rather than the
      # aggregation failing to start.
      - name: Download the vendor certification receipts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: client-certification-*
          path: evidence/clients
          merge-multiple: true

      # Cells root #3: the global receipts (deep fuzz). Also best-effort: a missing sweep reads as
      # `global-receipt-missing` in the decision, which is the fact to report, not a download error.
      - name: Download the global receipts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: global-receipts
          path: evidence/global

      # The decision is bound to the tagged COMMIT and to the attested PACKAGE digest, both supplied
      # by the caller — a manifest may not pick the build it is evidence for. The commit is read
      # from the CHECKOUT, not $GITHUB_SHA: an annotated tag push puts the TAG OBJECT's sha in
      # GITHUB_SHA, while every manifest and receipt binds to the peeled commit the checkout holds.
      # It independently loads and validates the twenty-one raw certification receipts and the raw
      # deep-fuzz receipt; the per-manifest certification summaries are compared against them, never
      # trusted.
      - name: Aggregate launch decision
        id: decide
        shell: bash
        env:
          CANDIDATE_SHA256: ${{ needs.verification.outputs.package_sha256 }}
        run: |
          set -o pipefail
          if [[ -z "$CANDIDATE_SHA256" ]]; then
            # A failed or skipped candidate leg attested no digest. The decision still produces a
            # VERDICT — a run that ends in a red matrix and no decision is exactly the silent
            # NO-GO this job exists to prevent — so the outputs and the uploaded decision.txt say
            # NO-GO by name, and the job fails because there are no bytes to decide about.
            {
              echo "decision: NO-GO"
              echo "blockers:"
              echo "  - candidate-package-unattested: the verification chain produced no candidate package digest, so there are no bytes to decide about"
            } > decision.txt
            cat decision.txt
            echo "decision=NO-GO" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          node scripts/launch-decision.mjs --cells evidence/cells \
            --certification-receipts evidence/clients \
            --global-receipts evidence/global \
            --candidate-commit "$(git rev-parse HEAD)" \
            --candidate-package "$CANDIDATE_SHA256" \
            --json-out decision.json | tee decision.txt
          status=${PIPESTATUS[0]}
          # decision.json is the PURE aggregate. Stdout carries the per-cell table and blocker
          # lines in front of the JSON, and a blocker line can itself contain a brace (an
          # unreadable receipt quotes its own JSON.parse failure) — so "everything from the first
          # {" is a parser that works only until the first corrupt file. The outputs are read from
          # the file, and the job's exit status still comes from the decision itself.
          node -e '
            const fs = require("fs");
            const aggregate = JSON.parse(fs.readFileSync("decision.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `decision=${aggregate.decision}\n`);
            fs.appendFileSync(out, `package_sha256=${aggregate.candidate?.packageSha256 ?? ""}\n`);
          '
          exit "$status"

      - name: Upload launch decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-crib-launch-decision
          path: decision.txt
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  release:
    name: Create GitHub release
    # Publication depends on BOTH the verification chain and the aggregate approval. `needs` already
    # implies success for both, so a failed or skipped decision leaves this job unrun — which is the
    # point: nothing may publish that the decision did not approve (A03). The certification and fuzz
    # jobs reach this only THROUGH the decision, which is what makes the decision the authority
    # rather than a second opinion on a green matrix.
    needs: [verification, launch-decision]
    if: ${{ needs.launch-decision.outputs.decision == 'GO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: knowledge-crib-release-bundle
          path: release-bundle

      # The decision approved specific BYTES, not a build name. Re-hash what was downloaded and
      # refuse to publish anything else — an artifact swapped between the decision and this step
      # is exactly the gap a digest comparison exists to close.
      - name: Verify downloaded bytes against the approved digest
        shell: bash
        env:
          APPROVED: ${{ needs.launch-decision.outputs.package_sha256 }}
        run: |
          if [[ -z "$APPROVED" ]]; then
            echo "the launch decision published no approved package digest — refusing to release" >&2
            exit 1
          fi
          TARBALL="$(find release-bundle -type f -name 'knowledge-crib-*.tgz' -not -name 'knowledge-crib-*-*.tgz' -print -quit)"
          if [[ -z "$TARBALL" ]]; then
            echo "no shipped package found in the verified bundle" >&2
            exit 1
          fi
          ACTUAL="sha256:$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
          if [[ "$ACTUAL" != "$APPROVED" ]]; then
            echo "downloaded package $ACTUAL does not match the approved digest $APPROVED" >&2
            exit 1
          fi
          echo "package digest matches the approved decision: $ACTUAL"

      - name: Validate tag and bundle version
        shell: bash
        run: |
          MANIFEST="$(find release-bundle -type f -name manifest.json -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Verified bundle does not contain manifest.json" >&2
            exit 1
          fi
          VERSION="$(node -e 'const fs = require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version)' "$MANIFEST")"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match bundle version $VERSION" >&2
            exit 1
          fi
          echo "BUNDLE_DIR=$(dirname "$MANIFEST")" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" "$BUNDLE_DIR"/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes