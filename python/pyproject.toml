[project]
name = "crib-worker"
version = "0.0.0"
description = "Offline multimodal extraction subprocess (PDF / image / whisper audio) for knowledge-crib. Pure-stdlib fake backend; real backends are optional extras."
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "knowledge-crib" }]
# No required runtime deps: the `fake` backend (used by the gate tests + offline determinism runs)
# is pure stdlib. Real extraction backends are opt-in extras so `uv sync` stays cheap by default.
dependencies = []

[project.optional-deps]
pdf = ["pypdf>=4.0"]
audio = ["faster-whisper>=1.0"]
image = ["surya-ocr>=0.6", "Pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crib_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]