      - generic [ref=f1e98]: "The explanation (and why we don't lean on it): on subscription plans, re-read context rides the cache-read bucket, priced ~0.1× of fresh input. A crib-primed session builds a large, byte-stable, highly cacheable context (88% hit) → most of its tokens are cheap reads → lower bill despite more tokens. A crib-less session churns files as fresh input and cache-writes (1.25×) → fewer tokens, higher bill. This subsidy is plan-specific. The definitive, plan-independent proof is the cache-cleared measurement in the next section."
