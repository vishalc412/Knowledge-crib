# project-doc-set configuration for knowledge-crib (see the project-doc-set skill).
organisation:
  name: "Knowledge-crib"
  system_name: "Knowledge-crib"
  doc_owner: "Vishal Chawla (maintainer)"
  accent_colour: "1F3864"

output:
  root: "docs/design"
  dist: "docs/design/dist"
  diagrams: "docs/design/diagrams"
  commit_docx: false
  numbering: true

publishing:
  default_targets: ["local"]
  publish_before_review: false

personas:
  always: ["enterprise_architect", "principal_engineer", "test_architect"]
  conditional:
    devops_platform: "never"
    data: "always"
  security_checklist: true
